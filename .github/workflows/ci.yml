name: variant-contracts

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 -m pip install Pillow fonttools
      - run: npm test -- --run
      - run: npm run lint
      - run: npm run audit:font-subset
      - run: npm run audit:stadium-slice
      - run: npm run build
      - run: npm run verify:compliant-pack
