name: variant-contracts

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 -m pip install Pillow
      - run: npm test -- --run
      - run: npm run lint
      - run: npm run build:showcase
      - name: Verify compliant fail-closed state or build ready targets
        env:
          H5_VALIDATOR_OPTIONAL: "1"
        run: |
          if node -e "const m=require('./art-packs/compliant/manifest.json');process.exit(m.status==='ready'?0:1)"; then
            npm run build:compliant
            npm run build:interactive
          else
            npm run verify:compliant-pack
          fi
